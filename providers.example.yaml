# 复制成 providers.yaml 再按需修改：
#   cp providers.example.yaml providers.yaml
#
# providers.yaml 已被 .gitignore 忽略，不会上传。
#
# 注意：这里只写「环境变量的名字」，不写 key 本身。
# 真实 key 放在 .env 里（见 .env.example），代码通过 os.environ 读取。

providers:
  chat:
    base_url: https://api.deepseek.com/v1
    api_key_env: CHAT_API_KEY
  vectors:
    base_url: https://api.siliconflow.cn/v1
    api_key_env: VEC_API_KEY

tasks:
  # 抽取：量大，挑最便宜的
  extract:
    provider: chat
    model: deepseek-chat
    json: strict

  # 周固化 / 季度画像：要长上下文（30k 起）
  settle:
    provider: chat
    model: deepseek-chat
    # 思考型模型（带 reasoning 的）会把 token 大量花在「想」上。
    # 上限给小了，正文一个字都出不来（finish_reason=length）。写长文的任务给 8000。
    max_tokens: 8000

  # 对话：产品的命门，用你付得起的最强那档
  dialogue:
    provider: chat
    model: deepseek-chat
    max_tokens: 4000
    # 速度实测（同一句提问）：deepseek-v4-pro 36.5 秒 / glm-5.3-flash 13.6 秒，质量都合格。
    # 觉得慢就换一档更轻的模型；觉得答得浅就换回重的那档。
    # 温度：抽取要稳定（0.2），对话要有温度（0.7）。写死 0.2 会让回答像在读台账。
    temperature: 0.7

  # 视觉：必须是多模态模型（上面的 chat 模型不支持图片时换成别的）
  vision:
    provider: chat
    model: <换成你接入时的多模态模型名>

  # 向量检索
  embed:
    provider: vectors
    model: BAAI/bge-m3
    batch: 64

  # 精排（可选，没有就删掉，检索走两路）
  rerank:
    provider: vectors
    model: BAAI/bge-reranker-v2-m3
